[project]
name = "terminal-note"
version = "0.1.0"
description = "A keyboard-driven terminal note manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit==3.0.53",
    "typer==0.27.2",
]

[project.scripts]
note = "note.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note"]
