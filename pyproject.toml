[project]
name = "terminal-note"
version = "0.1.0"
description = "A small terminal note manager with optional due dates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prompt-toolkit>=3.0.43,<4",
    "typer>=0.12.3,<1",
]

[project.scripts]
note = "note.cli:main"

[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note"]
